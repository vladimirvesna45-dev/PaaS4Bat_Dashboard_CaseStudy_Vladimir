# Test on PRs; on push to main (or manual run) build, push images, and deploy to Scaleway.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY_HOST: rg.fr-par.scw.cloud
  REGISTRY_NAMESPACE: namespace-paas4bat
  IMAGE_API: paas4bat-api
  IMAGE_WEB: paas4bat-web
  SCW_REGION: fr-par

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -q

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  deploy:
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      API_IMAGE: ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_API }}:${{ github.sha }}
      WEB_IMAGE: ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_WEB }}:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_API }}:latest
            ${{ env.API_IMAGE }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_WEB }}:latest
            ${{ env.WEB_IMAGE }}

      - name: Update Scaleway containers to new images
        env:
          SCW_REGION: ${{ env.SCW_REGION }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_CONTAINER_API_ID: ${{ secrets.SCW_CONTAINER_API_ID }}
          SCW_CONTAINER_WEB_ID: ${{ secrets.SCW_CONTAINER_WEB_ID }}
        run: |
          set -euo pipefail

          curl -sSL "https://github.com/scaleway/scaleway-cli/releases/download/v2.39.0/scaleway-cli_2.39.0_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/scw /usr/local/bin/scw

          wait_ready() {
            local id="$1" label="$2"
            for attempt in $(seq 1 72); do
              status=$(scw container container get "container-id=${id}" "region=${SCW_REGION:-fr-par}" -o json | jq -r .status)
              echo "${label} status: ${status} (attempt ${attempt})"
              case "${status}" in
                ready) return 0 ;;
                error)
                  scw container container get "container-id=${id}" "region=${SCW_REGION:-fr-par}" -o json | jq -r .error_message
                  return 1
                  ;;
              esac
              sleep 5
            done
            echo "${label} deploy timed out after 6 minutes"
            return 1
          }

          echo "Deploying API image: ${API_IMAGE}"
          scw container container update \
            "container-id=${SCW_CONTAINER_API_ID}" \
            "region=${SCW_REGION:-fr-par}" \
            "image=${API_IMAGE}"
          wait_ready "${SCW_CONTAINER_API_ID}" "API"

          echo "Deploying web image: ${WEB_IMAGE}"
          scw container container update \
            "container-id=${SCW_CONTAINER_WEB_ID}" \
            "region=${SCW_REGION:-fr-par}" \
            "image=${WEB_IMAGE}"
          wait_ready "${SCW_CONTAINER_WEB_ID}" "Web"

          echo "Scaleway deployment complete."

      - name: Show deployed image digests
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_CONTAINER_API_ID: ${{ secrets.SCW_CONTAINER_API_ID }}
          SCW_CONTAINER_WEB_ID: ${{ secrets.SCW_CONTAINER_WEB_ID }}
        run: |
          curl -sSL "https://github.com/scaleway/scaleway-cli/releases/download/v2.39.0/scaleway-cli_2.39.0_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/scw /usr/local/bin/scw
          echo "API container:"
          scw container container get "container-id=${SCW_CONTAINER_API_ID}" "region=fr-par" -o json | jq '{status, image: .registry_image, error_message}'
          echo "Web container:"
          scw container container get "container-id=${SCW_CONTAINER_WEB_ID}" "region=fr-par" -o json | jq '{status, image: .registry_image, error_message}'
